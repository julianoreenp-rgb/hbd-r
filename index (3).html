<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Rehan!</title>
<style>
  :root {
    --ratio-num: 1.41443;
    --s: 1; --ty: 0px;           /* envelope scale / shift   (set by JS) */
    --K: 1; --cy: 0px;           /* card pop-out scale / lift (set by JS) */
    --flap:   polygon(0 0, 100% 0, 100% 6.15%, 50% 59.4%, 0 6.15%);
    --pocket: polygon(0 6.15%, 43.5% 52.7%, 43.5% 48.8%, 56.5% 48.8%, 56.5% 52.7%, 100% 6.15%, 100% 100%, 0 100%);
    --inner:  polygon(0 0, 100% 0, 100% 6.15%, 50% 59.4%, 0 6.15%);
    --gingham:
      linear-gradient(90deg, rgba(110,165,220,0.38) 50%, transparent 50%),
      linear-gradient(0deg,  rgba(110,165,220,0.38) 50%, transparent 50%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background-color: #7aaed9;
    background-size: cover; background-position: center; background-repeat: no-repeat;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }

  /* the envelope stays at one size and position the whole time */
  .stage {
    position: fixed; top: 50%; left: 50%;
    width: min(90vw, calc(90vh * var(--ratio-num)));
    aspect-ratio: 2000 / 1414;
    perspective: 1800px;
    transform: translate(-50%, -50%) translateY(var(--ty)) scale(var(--s));
  }
  .stage > * { position: absolute; pointer-events: none; -webkit-user-drag: none; }

  .inside {
    inset: 0; width: 100%; height: 100%; z-index: 0;
    clip-path: var(--inner);
    background-color: #fff; background-image: var(--gingham); background-size: 11% 15.5%;
  }
  .inside::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(25,60,120,0.30), rgba(25,60,120,0) 70%);
  }
  .env { inset: 0; width: 100%; height: 100%; z-index: 2; clip-path: var(--pocket); }

  /* each card: a clipping wrapper (so it hides inside the envelope) + the card */
  .cw { inset: 0; width: 100%; height: 100%; z-index: 1; overflow: hidden; }
  .cw.front { z-index: 12; overflow: visible; }
  .card {
    position: absolute;
    left: 5.2%; top: 17%; width: 89.7%; height: 76.4%;
    opacity: 0;
    transform: translateY(66%) scale(0.88);
    filter: drop-shadow(0 6px 10px rgba(20,50,100,0.28));
    transition: transform 0.9s cubic-bezier(.3,.1,.2,1), opacity 0.4s ease-in-out;
  }
  .card.peek  { opacity: 1; transform: translateY(-3%) scale(0.88); }
  .card.out   { opacity: 1; transform: translateY(var(--cy)) scale(var(--K)); }
  .card.leave { opacity: 0; transition: opacity 0.35s ease-in-out; }
  .card.instant { transition: none; }
  .card img { display: block; width: 100%; height: 100%; }

  /* ---- candle flames (on the cake card) ---- */
  .flames { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.6s ease-in-out; }
  .flames.lit { opacity: 1; }
  .flame { position: absolute; width: 2.3%; aspect-ratio: 1 / 1.9; transform: translate(-50%, -96%); }
  .flame .fire {
    position: absolute; inset: 0;
    border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
    background: radial-gradient(ellipse at 50% 72%, #fffbe0 0%, #ffe066 28%, #ffa63a 62%, rgba(255,90,0,0.85) 100%);
    transform-origin: 50% 100%;
    animation: flicker 0.38s ease-in-out infinite alternate;
    transition: transform 0.25s ease-in, opacity 0.25s ease-in;
  }
  .flame::after {                                  /* soft glow */
    content: ""; position: absolute; left: -130%; right: -130%; top: -30%; bottom: -60%;
    background: radial-gradient(circle, rgba(255,196,80,0.55) 0%, rgba(255,196,80,0) 65%);
    animation: glow 0.9s ease-in-out infinite alternate;
    transition: opacity 0.25s;
  }
  .flame::before {                                 /* smoke puff when blown out */
    content: ""; position: absolute; left: 20%; width: 60%; aspect-ratio: 1; bottom: 40%;
    border-radius: 50%; background: rgba(130,130,140,0.55); filter: blur(2px); opacity: 0;
  }
  .flame.out .fire { animation: none; transform: scale(0.05, 0.05); opacity: 0; }
  .flame.out::after { opacity: 0; animation: none; }
  .flame.out::before { animation: smoke 1.2s ease-out forwards; }
  @keyframes flicker {
    0%   { transform: scale(1, 1) rotate(-3deg); }
    50%  { transform: scale(0.92, 1.1) rotate(2deg); }
    100% { transform: scale(1.06, 0.95) rotate(-1deg); }
  }
  @keyframes glow  { from { opacity: 0.65; transform: scale(0.95); } to { opacity: 1; transform: scale(1.08); } }
  @keyframes smoke { 0% { opacity: 0.7; transform: translateY(0) scale(0.6); }
                     100% { opacity: 0; transform: translateY(-420%) scale(2.2); } }

  /* ---- small wish text + confetti ---- */
  .wish {
    position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom));
    transform: translate(-50%, 8px);
    max-width: 90vw; text-align: center;
    font-family: Georgia, "Times New Roman", serif; font-style: italic;
    font-size: clamp(11px, 1.5vw, 14px); line-height: 1.4;
    color: #fff; text-shadow: 0 1px 3px rgba(10,40,90,0.75), 0 0 8px rgba(10,40,90,0.45);
    opacity: 0; pointer-events: none; z-index: 55;
    transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
  }
  .wish.show { opacity: 1; transform: translate(-50%, 0); }
  .wish.love { font-size: clamp(13px, 2vw, 18px); }
  .meter { display: none; width: 110px; height: 4px; margin: 6px auto 0; border-radius: 4px;
           background: rgba(255,255,255,0.3); overflow: hidden; }
  .meter b { display: block; width: 0; height: 100%; background: #fff; border-radius: 4px; }
  .wish.listening .meter { display: block; }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

  /* the 3D top flap (stays open) */
  .flap {
    inset: 0; width: 100%; height: 100%; z-index: 10;
    transform-origin: 50% 0; transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(.5, 0, .25, 1);
  }
  .flap.open    { transform: rotateX(-178deg); }
  .flap.instant { transition: none; }
  .flap .face {
    position: absolute; inset: 0; width: 100%; height: 100%;
    clip-path: var(--flap);
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .flap .back {
    transform: rotateY(180deg);
    background-color: #fff; background-image: var(--gingham); background-size: 11% 15.5%;
  }
  .flap .back::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(0deg, rgba(30,70,130,0.22), rgba(30,70,130,0) 60%);
  }

  .hint {
    position: fixed; left: 0; right: 0;
    bottom: max(10px, env(safe-area-inset-bottom));
    text-align: center;
    font-family: Georgia, "Times New Roman", serif; font-style: italic;
    font-size: clamp(12px, 1.6vw, 15px); letter-spacing: 0.04em;
    color: rgba(255,255,255,0.88); text-shadow: 0 1px 4px rgba(0,0,0,0.55);
    pointer-events: none; z-index: 50;
    animation: breathe 3s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: .4; } 50% { opacity: .9; } }

  @media (prefers-reduced-motion: reduce) {
    .flap, .card { transition-duration: 0.01s; }
    .hint { animation: none; opacity: .6; }
  }
</style>
</head>
<body>

<main class="stage" id="stage" aria-live="polite">
  <div class="inside"></div>
  <div class="cw"><div class="card"><img alt="Happy Birthday, Rehan!"></div></div>
  <div class="cw"><div class="card"><img alt="A personal birthday letter"></div></div>
  <div class="cw"><div class="card"><img alt="A playlist for Rehan"></div></div>
  <div class="cw"><div class="card"><img alt="A birthday cake card"><div class="flames" id="flames"></div></div></div>
  <img class="env" id="env" alt="Birthday envelope for Rehan">
  <div class="flap" id="flap">
    <img class="face front" id="flapFront" alt="">
    <div class="face back"></div>
  </div>
</main>

<p class="hint" id="hint">Tap anywhere to open</p>
<div class="wish" id="wish"><span id="wishText"></span><i class="meter"><b id="meterFill"></b></i></div>
<canvas id="confetti"></canvas>

  var locks = [500, 900, 1300, 1500, 1500, 1500, 1200];

  document.body.style.backgroundImage = "url('" + IMGS[8] + "')";
  document.getElementById('env').src = IMGS[1];
  document.getElementById('flapFront').src = IMGS[1];
  cards.forEach(function (c, k) { c.querySelector('img').src = IMGS[k + 3]; });

  // Envelope size: small enough that the open flap fits on screen.
  // Cards pop out larger than the envelope so they are easy to read.
  function measure() {
    var h = stage.offsetHeight;
    var s = Math.min(1, (window.innerHeight * 0.88) / (1.62 * h));
    var ty = 0.31 * h * s;
    stage.style.setProperty('--s', s);
    stage.style.setProperty('--ty', ty + 'px');
    stage.style.setProperty('--K', Math.min(1 / s, 1.25 / s));
    stage.style.setProperty('--cy', (-(0.31 * h + 0.052 * h)) + 'px');
  }

  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function instant(el, cls) {
    el.classList.add('instant'); el.className = 'card instant ' + (cls || '');
    void el.offsetWidth; el.classList.remove('instant');
  }
  function hide(k) { wraps[k].className = 'cw'; instant(cards[k], ''); }
  function pop(k) {                       // card comes forward out of the envelope
    wraps[k].className = 'cw front';
    cards[k].className = 'card out';
  }
  function rise(k) {                      // card slides up inside the envelope, then pops out
    cards[k].className = 'card peek';
    later(function () { pop(k); }, 450);
  }
  function leave(k) {                     // card goes away, then resets
    cards[k].className = 'card out leave';
    later(function () { hide(k); }, 420);
  }


  /* ================= candles, mic and confetti ================= */
  var wish = document.getElementById('wish');
  var flamesBox = document.getElementById('flames');
  var canvas = document.getElementById('confetti');
  var INSTR = '💨 Blow into your mic to make a wish & blow out the candles!';
  var LOVE  = 'I love you so much, jaanu! 💙 (Click screen to continue)';
  var CANDLES = [[45.8, 27.9], [48.2, 27.4], [50.8, 27.4], [52.8, 27.8]];   // % of the card
  var blown = false, micFailed = false;
  var mic = { stream: null, ctx: null, raf: 0 };

  var flameEls = CANDLES.map(function (p) {
    var f = document.createElement('div');
    f.className = 'flame';
    f.style.left = p[0] + '%'; f.style.top = p[1] + '%';
    f.innerHTML = '<span class="fire"></span>';
    f.querySelector('.fire').style.animationDelay = (Math.random() * -0.4) + 's';
    flamesBox.appendChild(f);
    return f;
  });

  var wishText = document.getElementById('wishText');
  var meterFill = document.getElementById('meterFill');
  function showWish(text, love, listening) {
    wish.className = 'wish' + (love ? ' love' : '') + (listening ? ' listening' : '');
    wishText.textContent = text;
    meterFill.style.width = '0%';
    void wish.offsetWidth;
    wish.classList.add('show');
  }
  function resetFlames() {
    flamesBox.classList.remove('lit');
    flameEls.forEach(function (f) { f.classList.remove('out'); });
  }

  function stopMic() {
    cancelAnimationFrame(mic.raf);
    if (mic.stream) mic.stream.getTracks().forEach(function (t) { t.stop(); });
    if (mic.ctx && mic.ctx.close) { try { mic.ctx.close(); } catch (e) {} }
    mic.stream = null; mic.ctx = null;
  }

  function startMic() {
    if (blown || mic.stream) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { micUnavailable(); return; }
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false } })
      .then(function (stream) {
        if (current !== 5 || blown) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
        var AC = window.AudioContext || window.webkitAudioContext;
        var ctx = new AC();
        if (ctx.resume) ctx.resume();
        var src = ctx.createMediaStreamSource(stream);
        var analyser = ctx.createAnalyser();
        analyser.fftSize = 1024;
        src.connect(analyser);
        mic.stream = stream; mic.ctx = ctx;

        var buf = new Float32Array(analyser.fftSize);
        var bytes = new Uint8Array(analyser.fftSize);
        var ambient = 0.01, loudSince = 0, t0 = performance.now();

        (function loop() {
          var sum = 0, i;
          if (analyser.getFloatTimeDomainData) {
            analyser.getFloatTimeDomainData(buf);
            for (i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
          } else {
            analyser.getByteTimeDomainData(bytes);
            for (i = 0; i < bytes.length; i++) { var v = (bytes[i] - 128) / 128; sum += v * v; }
          }
          var rms = Math.sqrt(sum / analyser.fftSize);
          var now = performance.now();
          var limit = Math.max(0.03, ambient * 3 + 0.02);       // louder than the room, and clearly a blow
          meterFill.style.width = Math.min(100, (rms / limit) * 100) + '%';
          if (now - t0 > 700) {
            if (rms > limit) { if (!loudSince) loudSince = now; if (now - loudSince > 180) { blowOut(); return; } }
            else { loudSince = 0; ambient = ambient * 0.97 + rms * 0.03; }
          } else { ambient = Math.max(ambient, rms); }           // learn the room noise first
          mic.raf = requestAnimationFrame(loop);
        })();
      })
      .catch(micUnavailable);
  }

  function micUnavailable() {
    if (current !== 5 || blown) return;
    micFailed = true;
    showWish('Please allow your microphone to blow out the candles 🎤 (tap to try again)');
  }

  function blowOut() {
    if (blown) return;
    blown = true;
    stopMic();
    flameEls.forEach(function (f, k) { setTimeout(function () { f.classList.add('out'); }, k * 70); });
    confettiBurst();
    showWish(LOVE, true);
  }

  function enterCake() {
    blown = false; micFailed = false;
    resetFlames();
    wish.className = 'wish';
    later(function () {
      flamesBox.classList.add('lit');
      showWish(INSTR, false, true);
      startMic();
    }, 1300);
  }
  function leaveCake() {
    stopMic();
    wish.classList.remove('show');
    later(resetFlames, 500);
  }

  /* simple canvas confetti + sparkles (no libraries) */
  function confettiBurst() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = canvas.width = innerWidth * dpr, H = canvas.height = innerHeight * dpr;
    var ctx = canvas.getContext('2d');
    var colors = ['#ff6b9d', '#ffd93d', '#6bcbff', '#9b8cff', '#7dffb2', '#ff9f6b', '#ffffff'];
    var parts = [];
    function add(n, x, y, spread, base, power, delay) {
      for (var i = 0; i < n; i++) {
        var ang = base + (Math.random() - 0.5) * spread, sp = power * (0.4 + Math.random() * 0.6);
        parts.push({ x: x, y: y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                     w: (5 + Math.random() * 7) * dpr, h: (3 + Math.random() * 5) * dpr,
                     rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4,
                     c: colors[(Math.random() * colors.length) | 0],
                     shape: Math.random() < 0.25 ? 2 : (Math.random() < 0.5 ? 1 : 0),
                     wait: delay, life: 0 });
      }
    }
    var cx = W / 2, cy = H * 0.42;
    add(110, cx, cy, 6.28, 0, 16 * dpr, 0);                          // burst from the cake
    add(60, 0, H, 0.9, -1.0, 24 * dpr, 100);                         // left cannon
    add(60, W, H, 0.9, -2.14, 24 * dpr, 100);                        // right cannon
    for (var i = 0; i < 90; i++) {                                   // gentle rain from the top
      parts.push({ x: Math.random() * W, y: -20 * dpr, vx: (Math.random() - 0.5) * 2 * dpr, vy: (1 + Math.random() * 3) * dpr,
                   w: (5 + Math.random() * 6) * dpr, h: (3 + Math.random() * 4) * dpr, rot: Math.random() * 6.28,
                   vr: (Math.random() - 0.5) * 0.3, c: colors[(Math.random() * colors.length) | 0],
                   shape: Math.random() < 0.3 ? 2 : 0, wait: 250 + Math.random() * 900, life: 0 });
    }
    var t0 = performance.now(), grav = 0.35 * dpr;
    function star(x, y, r) {
      ctx.beginPath();
      for (var k = 0; k < 8; k++) { var rr = k % 2 ? r * 0.4 : r, a = k * Math.PI / 4; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
      ctx.closePath(); ctx.fill();
    }
    (function frame(now) {
      var el = now - t0, alive = 0;
      ctx.clearRect(0, 0, W, H);
      parts.forEach(function (p) {
        if (el < p.wait) { alive++; return; }
        p.life++;
        p.vx *= 0.992; p.vy = p.vy * 0.992 + grav * 0.5; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        if (p.y > H + 30 * dpr) return;
        alive++;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.c; ctx.globalAlpha = Math.min(1, (260 - p.life) / 60);
        if (p.shape === 1) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, 6.28); ctx.fill(); }
        else if (p.shape === 2) { star(0, 0, p.w * 0.9); }
        else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (alive && el < 7000) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
    })(t0);
  }

  function render(prev) {
    var i = current;
    timers.forEach(clearTimeout); timers = [];

    // flap
    if (i === 0) {
      flap.className = 'flap';
    } else if (i >= 1 && i <= 5) {
      flap.className = 'flap'; void flap.offsetWidth; flap.classList.add('open');
    } else {                                              // 6: fold closed after the card leaves
      later(function () { flap.className = 'flap'; }, 350);
    }

    // cards: card k is fully out at step k + 2
    for (var k = 0; k < 4; k++) {
      var at = k + 2;
      if (i === at) {
        if (k === 0) pop(0); else rise(k);                // greeting card is already peeking
      } else if (i === at + 1) {
        leave(k);
      } else if (i === 1 && k === 0) {
        wraps[0].className = 'cw'; cards[0].className = 'card peek';
        cards[0].style.transitionDelay = '0.45s';
      } else if (i < at || i > at + 1) {
        hide(k);
      }
    }
    if (i !== 1) cards[0].style.transitionDelay = '0s';

    if (i === 5) enterCake(); else leaveCake();
    hint.textContent = hints[i];
  }

  function next() {
    var now = Date.now();
    if (now < lockUntil) return;
    if (current === 5 && !blown) { if (micFailed) { micFailed = false; showWish(INSTR, false, true); startMic(); } return; }
    var prev = current;
    current = (current + 1) % TOTAL;
    lockUntil = now + locks[current];
    render(prev);
  }

  window.addEventListener('resize', measure);
  document.addEventListener('click', next);
  document.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); next(); }
  });

  measure();
  render(0);
})();
</script>
</body>
</html>
